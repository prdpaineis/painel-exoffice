name: Atualizar painel diariamente

on:
  schedule:
    - cron: "0 10 * * *"   # 07:00 BRT (UTC-3), todos os dias
  workflow_dispatch:          # permite rodar manualmente no GitHub

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # precisa para commitar out/painel-exoffice.html atualizado

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar painel
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_LOGIN: ${{ secrets.ODOO_LOGIN }}
          ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
        run: python main.py

      - name: Commitar painel atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/painel-exoffice.html
          git diff --cached --quiet || git commit -m "painel: atualização automática $(date +'%d/%m/%Y')"
          git push
